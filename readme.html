<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>遊戲說明文件 - 蘿莉遇櫃人</title>
    <!-- 新增中文註解：將說明文件網頁圖示設定為蘿莉照片 -->
    <link rel="icon" href="assets/images/羅莉抓人.png" type="image/png">
    <!-- 引入 GitHub 暗色主題 Markdown CSS（必須用 dark 版本，避免淺色文字導致全黑） -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.2.0/github-markdown-dark.min.css">
    <!-- 引入 Marked.js 解析 Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        /* ===== 基礎頁面樣式 ===== */
        html {
            scroll-behavior: smooth; /* 目錄錨點平滑滾動 */
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #0d1117; /* GitHub 深色底 */
            color: #c9d1d9;
        }
        /* Markdown 內容區域排版 */
        .markdown-body {
            max-width: 960px;
            margin: 0 auto;
            padding: 40px 24px;
        }

        /* ===== 「蘿莉遇櫃人」大標題金色特效 ===== */
        .markdown-body h1 {
            font-size: clamp(36px, 5.4vw, 100px) !important;
            text-align: center !important;
            margin: 0 auto 16px auto !important;
            padding: 12px 0 !important;
            line-height: 1.4 !important;
            border-bottom: 2px solid #d4af37 !important;
            /* 金色漸層文字 */
            background: linear-gradient(to right, #ffffff, #d4af37) !important;
            -webkit-background-clip: text !important;
            -webkit-text-fill-color: transparent !important;
            text-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
        }
        
        /* ===== 二級標題藍色特效 ===== */
        /* 新增中文註解：將 H2 標題套用與目錄連結相同的亮藍色效果，使視覺風格呼應 */
        .markdown-body h2 {
            color: #58a6ff !important;
            border-bottom: 1px solid rgba(88, 166, 255, 0.3) !important;
            text-shadow: 0 0 10px rgba(88, 166, 255, 0.15);
        }

        /* ===== 重要澄清彈窗遮罩 ===== */
        #overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        /* 彈窗卡片 */
        #popup {
            background: #161b22;
            border: 2px solid #8957e5;
            border-radius: 12px;
            max-width: 520px;
            width: 90%;
            padding: 28px;
            text-align: center;
            color: #c9d1d9;
        }
        #popup h2 {
            font-size: 18px;
            color: #ffb700;
            margin: 0 0 16px 0;
        }
        #popup .body {
            font-size: 14px;
            line-height: 1.65;
            text-align: left;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 20px;
        }
        #popup code {
            background: rgba(110,118,129,0.35);
            padding: 2px 5px;
            border-radius: 4px;
            color: #f85149;
        }

        /* ===== 3 秒進度填色按鈕 ===== */
        #confirmBtn {
            position: relative;
            display: inline-block;
            padding: 12px 36px;
            font-size: 15px;
            font-weight: 600;
            color: #8b949e;
            background: #21262d;
            border: 1px solid #30363d;
            border-radius: 8px;
            cursor: not-allowed;
            overflow: hidden;
            outline: none;
        }
        /* 按鈕文字置於填色上方 */
        #confirmBtn span {
            position: relative;
            z-index: 2;
        }
        /* 從左到右填色的偽元素 */
        #confirmBtn::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 0;
            height: 100%;
            background: linear-gradient(135deg, #8957e5, #58a6ff);
            z-index: 1;
        }
        /* 動畫播放中 */
        #confirmBtn.filling::before {
            animation: fill 3s linear forwards;
        }
        @keyframes fill {
            to { width: 100%; }
        }
        /* 3 秒後可點擊狀態 */
        #confirmBtn.ready {
            cursor: pointer;
            color: #fff;
            border-color: transparent;
        }
        #confirmBtn.ready::before {
            width: 100%;
        }

        /* ===== 內容預設隱藏 ===== */
        #content {
            display: none;
        }
    </style>
</head>
<body>

    <!-- 重要澄清彈窗 -->
    <div id="overlay">
        <div id="popup">
            <h2>⚠️ 重要澄清 / IMPORTANT</h2>
            <div class="body">
                <p><strong>重要澄清</strong>：本專案資料夾名稱為 <code>curseforge</code>，但此 <strong><code>curseforge</code> 並非大家所想的那個 Minecraft 模組下載/管理應用程式 (CurseForge)</strong>！</p>
                <p>這只是當初建立專案時，直接拿隨手建的資料夾來使用且忘記修改名稱而已，請大家不要誤會喔！</p>
            </div>
            <button id="confirmBtn" type="button" disabled>
                <span>我已閱讀並瞭解 (3s)</span>
            </button>
        </div>
    </div>

    <!-- Markdown 渲染容器（預設隱藏） -->
    <div id="content" class="markdown-body">載入中…</div>

    <script>
        // ===== 1. 載入並渲染 README.md =====
        if (typeof marked !== 'undefined') {

            // 讀取 README.md（附帶時間戳防快取） (新增中文註解：非同步載入 README 檔案)
            fetch('./README.md?t=' + Date.now())
                .then(function(r) { return r.ok ? r.text() : Promise.reject('找不到 README.md'); })
                .then(function(md) {
                    // 新增中文註解：雙重保險後處理，強行覆蓋分配與 GitHub 吻合的 slug ID，防範 marked 預設生成無效 ID
                    var htmlContent = marked.parse(md);
                    console.log('[Readme.html Debug] Marked parsed HTML length:', htmlContent.length);
                    document.getElementById('content').innerHTML = htmlContent;
                    console.log('[Readme.html Debug] Content innerHTML sample:', htmlContent.substring(0, 1500));

                    var headings = document.getElementById('content').querySelectorAll('h1, h2, h3, h4, h5, h6');
                    headings.forEach(function(h) {
                        var text = h.textContent || '';
                        var id = text.toLowerCase().trim()
                            .replace(/\s+/g, '-')
                            .replace(/[()（）「」\[\]{}?!.,;:：，。；+=%$#@`~*]/g, '')
                            .replace(/[^\w\u4e00-\u9fa5-]/g, '');
                        h.id = id;
                        console.log('[Readme.html Debug] Set heading ID:', h.tagName, 'text:', text, '=> ID:', id);
                    });
                })
                .catch(function(e) {
                    document.getElementById('content').innerHTML = '<h1>載入失敗</h1><p>' + e + '</p>';
                });
        }

        // ===== 2. 三秒倒數與彈窗邏輯 =====
        var btn = document.getElementById('confirmBtn');
        var btnText = btn.querySelector('span');
        var remaining = 3;

        // 開始填色動畫
        btn.classList.add('filling');

        // 每秒更新倒數文字
        var timer = setInterval(function() {
            remaining--;
            if (remaining > 0) {
                btnText.textContent = '我已閱讀並瞭解 (' + remaining + 's)';
            } else {
                clearInterval(timer);
                btnText.textContent = '我已閱讀並瞭解';
                btn.disabled = false;
                btn.classList.remove('filling');
                btn.classList.add('ready');
            }
        }, 1000);

        // 按鈕點擊：移除遮罩、顯示內容
        // 按鈕點擊：移除遮罩、顯示內容
        btn.addEventListener('click', function() {
            if (btn.disabled) return;
            
            // 新增中文註解：暫時移除 hash 以免 display: block 時觸發瀏覽器預設的錨點跳轉滾動
            var hash = window.location.hash;
            if (hash) {
                history.replaceState(null, document.title, window.location.pathname + window.location.search);
            }
            
            // 直接從 DOM 刪除遮罩，乾淨俐落
            document.getElementById('overlay').remove();
            // 顯示說明文件
            document.getElementById('content').style.display = 'block';
            
            // 新增中文註解：在內容排版完成後默默把 hash 放回網址，但不觸發任何頁面滾動
            if (hash) {
                setTimeout(function() {
                    history.replaceState(null, document.title, window.location.pathname + window.location.search + hash);
                }, 200);
            }
        });

        // 新增中文註解：監聽內容區所有的錨點超連結點擊，實現平滑滾動效果
        document.getElementById('content').addEventListener('click', function(e) {
            var a = e.target.closest('a');
            if (a) {
                var href = a.getAttribute('href');
                console.log('[Readme.html Debug] Clicked link href:', href);
                if (href && href.indexOf('#') !== -1) {
                    var hash = href.substring(href.indexOf('#'));
                    var targetId = decodeURIComponent(hash.substring(1));
                    console.log('[Readme.html Debug] Target element ID:', targetId);
                    var element = document.getElementById(targetId);
                    if (element) {
                        e.preventDefault();
                        console.log('[Readme.html Debug] Element found! Scrolling smoothly to:', targetId);
                        element.scrollIntoView({ behavior: 'smooth', block: 'start' });
                        // 更新瀏覽器歷史狀態中的 hash，但不引發預設的跳躍
                        history.pushState(null, null, hash);
                    } else {
                        console.warn('[Readme.html Debug] Target element not found for ID:', targetId);
                    }
                }
            }
        });
    </script>
</body>
</html>
